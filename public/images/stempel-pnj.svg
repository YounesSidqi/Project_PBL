<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="160" height="160">
  <!-- Outer Circular Border with dash style -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#0056B3" stroke-width="4" stroke-opacity="0.85"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#0056B3" stroke-width="1.5" stroke-dasharray="4,2" stroke-opacity="0.7"/>
  <circle cx="100" cy="100" r="62" fill="none" stroke="#0056B3" stroke-width="1.5" stroke-opacity="0.85"/>

  <!-- Curved Circular Text Top -->
  <path id="curve-top" fill="none" d="M 22 100 A 78 78 0 0 1 178 100" />
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#0056B3" fill-opacity="0.9" letter-spacing="1.2">
    <textPath href="#curve-top" startOffset="50%" text-anchor="middle">
      POLITEKNIK NEGERI JAKARTA
    </textPath>
  </text>

  <!-- Curved Circular Text Bottom -->
  <path id="curve-bottom" fill="none" d="M 178 100 A 78 78 0 0 1 22 100" />
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#0056B3" fill-opacity="0.9" letter-spacing="1.1">
    <textPath href="#curve-bottom" startOffset="50%" text-anchor="middle">
      JURUSAN TEKNIK INFORMATIKA &amp; KOMPUTER
    </textPath>
  </text>

  <!-- Center Decorative Banner -->
  <rect x="36" y="86" width="128" height="28" rx="5" fill="#0056B3" fill-opacity="0.12" stroke="#0056B3" stroke-width="1.5"/>
  <text x="100" y="99" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="800" fill="#0056B3" text-anchor="middle" letter-spacing="1.5">TERVERIFIKASI</text>
  <text x="100" y="109" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="600" fill="#0056B3" text-anchor="middle" letter-spacing="0.5">RESMI SIM-PKL</text>

  <!-- Stars -->
  <polygon points="26,100 28,104 33,104 29,107 31,111 26,108 21,111 23,107 19,104 24,104" fill="#0056B3" opacity="0.8"/>
  <polygon points="174,100 176,104 181,104 177,107 179,111 174,108 169,111 171,107 167,104 172,104" fill="#0056B3" opacity="0.8"/>
</svg>
